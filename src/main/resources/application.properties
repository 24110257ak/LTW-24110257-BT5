# ==========================================
# Cấu hình Ứng dụng Spring Boot - Bài tập 5
# ==========================================

spring.application.name=bt5

# Cấu hình Cổng máy chủ
server.port=8080

# Cấu hình Kết nối CSDL SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bt27082026;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123

# Cấu hình JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình JSP & JSTL View Resolver
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

# Cấu hình Giới hạn Tải lên Tập tin
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Đường dẫn thư mục lưu trữ ảnh tải lên
app.upload.dir=d:/upload
